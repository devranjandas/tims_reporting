{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>Change password</h1>
  {% if current_user.must_change_password %}<p class="note">You must choose a new password before you continue.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password <input name="new" type="password" autocomplete="new-password" required minlength="{{ config.PASSWORD_MIN_LENGTH }}"></label>
    <label>Repeat new password <input name="confirm" type="password" autocomplete="new-password" required></label>
    <p class="hint">At least {{ config.PASSWORD_MIN_LENGTH }} characters.</p>
    <button class="primary">Change password</button>
  </form>
</div>
{% endblock %}
