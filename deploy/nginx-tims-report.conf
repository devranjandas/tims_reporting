# Example nginx site for TIMS-Report. Copy to /etc/nginx/conf.d/ (RHEL) or
# /etc/nginx/sites-available/ (Ubuntu), set server_name and the certificate paths
# issued by your internal certificate authority, then reload nginx.
server {
    listen 80;
    server_name tims-report.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tims-report.example.internal;

    ssl_certificate     /etc/pki/tls/certs/tims-report.crt;
    ssl_certificate_key /etc/pki/tls/private/tims-report.key;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
